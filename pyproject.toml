[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freelancer-ops-mcp"
version = "0.1.0"
description = "Client onboarding, invoices from calendar and commits, status reports and overdue chasers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "R28 AI, Inc.", email = "oss@r28.ai" }]
keywords = ["mcp", "mcp-server", "ai-agents", "charter", "stripe", "google-drive", "linear", "google-calendar", "gmail", "github", "google-docs", "granola", "google-sheets", "firecrawl"]
dependencies = ["charter-packs-mcp @ https://github.com/r28ai/charter-packs-mcp/releases/download/v0.1.0/charter_packs_mcp-0.1.0-py3-none-any.whl"]

[project.urls]
Repository = "https://github.com/r28ai/freelancer-ops-mcp"
Charter = "https://github.com/r28ai/charter"
Documentation = "https://docs.r28.ai/charter"

[project.scripts]
freelancer-ops-mcp = "freelancer_ops_mcp:main"

[tool.hatch.metadata]
# charter-packs-mcp is a dependency by its GitHub release's wheel, not a PyPI name.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/freelancer_ops_mcp"]
